syntax = "proto3";

option java_multiple_files = true;
option java_package = "{{ root_package }}.api.v1";
option java_outer_classname = "{{ PrefixName }}{{ SuffixName }}Proto";

// Flat, name-derived package (p6m standards S2): the same answers produce the identical wire
// surface in every p6m language.
package {{ prefix_name }}_{{ suffix_name }};

service {{ PrefixName }}{{ SuffixName }} {
    rpc Create{{ PrefixName }}(Create{{ PrefixName }}Request) returns ({{ PrefixName }});
    rpc Get{{ PrefixName }}(Get{{ PrefixName }}Request) returns ({{ PrefixName }});
    rpc List{{ PrefixName }}s(List{{ PrefixName }}sRequest) returns (List{{ PrefixName }}sResponse);
    rpc Update{{ PrefixName }}(Update{{ PrefixName }}Request) returns ({{ PrefixName }});
    rpc Delete{{ PrefixName }}(Delete{{ PrefixName }}Request) returns (Delete{{ PrefixName }}Response);
}

message {{ PrefixName }} {
    string id = 1;
    string display_name = 2;
}

message Create{{ PrefixName }}Request {
    string display_name = 1;
}

message Get{{ PrefixName }}Request {
    string id = 1;
}

message List{{ PrefixName }}sRequest {}

message List{{ PrefixName }}sResponse {
    repeated {{ PrefixName }} items = 1;
}

message Update{{ PrefixName }}Request {
    string id = 1;
    string display_name = 2;
}

message Delete{{ PrefixName }}Request {
    string id = 1;
}

message Delete{{ PrefixName }}Response {}
