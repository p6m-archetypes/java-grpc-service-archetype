syntax = "proto3";

option java_multiple_files = true;
option java_package = "{{ root_package }}.api.v1";
option java_outer_classname = "{{ PrefixName }}{{ SuffixName }}Proto";

package {{ prefix_name }}.{{ suffix_name }}.v1;

service {{ PrefixName }}{{ SuffixName }} {
    rpc Health(HealthRequest) returns (HealthResponse);
}

message HealthRequest {}

message HealthResponse {
    string status = 1;
}
